<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>已拦截 · Focus Guard</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #10141a; color: #dde3ea;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }
        .card {
            max-width: 460px; padding: 40px 44px; text-align: center;
            background: #171d26; border: 1px solid #2a3341; border-radius: 14px;
        }
        .icon { font-size: 52px; margin-bottom: 12px; }
        h1 { font-size: 20px; margin: 0 0 6px; color: #ef8f6b; }
        .domain { font-size: 16px; font-weight: 600; color: #fff; word-break: break-all; }
        .reason { margin-top: 14px; font-size: 13.5px; color: #9aa7b5; line-height: 1.7; }
        .budget { color: #7bc47f; font-weight: 600; }
        .tip { margin-top: 20px; padding-top: 16px; border-top: 1px solid #2a3341;
               font-size: 12px; color: #66707d; line-height: 1.8; }
        button {
            margin-top: 22px; padding: 9px 26px; font-size: 14px; cursor: pointer;
            border: 1px solid #3a4553; border-radius: 8px;
            background: #222b37; color: #dde3ea;
        }
        button:hover { background: #2a3543; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🚫</div>
        <h1>该站点已被拦截</h1>
        <div class="domain" id="domain">—</div>
        <div class="reason" id="reason"></div>
        <div class="tip">
            拦截仅在工作时段内生效，下班后自动放行。<br>
            额度每日零点重置 · 记账覆盖 msedge 与 chrome 两边合计。
        </div>
        <button id="close">回去了，关掉这个标签页</button>
    </div>
    <script src="blocked.js"></script>
</body>
</html>

[General]
;; 总开关 (托盘 Focus 菜单亦可暂停 10 分钟)
Enabled=1
;; 本地服务端口 (扩展从这里拉配置/上报用量), 只绑 127.0.0.1
Port=51730

[Worktime]
;; 工作日: 周一=0 ... 周日=6
Days=0,1,2,3,4
;; 工作时段 (只有这些窗口内才拦; 其余时间只记账不拦)
Windows=08:30-11:20,13:30-16:30
;; 每站每日默认额度 (分钟), 0 = 工作时段内硬拦
Default=5

[Sites]
;; domain=额度分钟。子域自动匹配 (bilibili.com 覆盖 www./m.)。
;; 预算在每个工作日 00:00 归零; 下班后全部放行。
bilibili.com=5
b23.tv=5
xiaohongshu.com=5
xhslink.com=5
x.com=5
twitter.com=5
youtube.com=5
youtu.be=5
threads.net=5
instagram.com=5
;; (按需增删, 写法相同)

;; 按浏览器追加/覆盖 (浏览器 id: msedge | chrome), 同名域覆盖 [Sites]
[Sites.msedge]
[Sites.chrome]
